<script>
/* ===== ตั้งค่าตรงนี้ ===== */
const CFG = {
  discordClientId: '1413900734063448084',
  owner: 'unscopicdevelop-ux',
  repo: 'unscopiclauncher',
  branch: 'main',
  path: 'data/servers.json',
  imgDir: 'data/img',
  stage: { w: 960, h: 600, mode: 'fit', min: 0.3, max: 2 } // mode: 'fit' = ย่อ/ขยายตามหน้าจอ (สัดส่วนคงที่), 'fixed' = ขนาดตายตัวไม่ย่อขยาย
};
/* ======================== */

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const LS = {
  get: k => { try { return localStorage.getItem(k) } catch { return null } },
  set: (k, v) => { try { localStorage.setItem(k, v) } catch {} },
  del: k => { try { localStorage.removeItem(k) } catch {} }
};
const ic = {
  user: '<svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0z"/></svg>',
  login: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4M10 17l5-5-5-5M15 12H3"/></svg>',
  out: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg>',
  plus: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
  edit: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 20h9M16.500 3.500a2.100 2.100 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>',
  lock: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>'
};

let servers = [], sel = null, discordUser = null, timer, pendingFile = null;
let isAdmin = LS.get('skr_admin') === '1';

/* ---------- Toast / Modal ---------- */
let tt;
function toast(msg, type) {
  const t = $('#toast');
  t.textContent = T(msg);
  t.style.borderColor = type === 'err' ? '#ef5350' : type === 'ok' ? '#2aa9dc' : '#24252c';
  t.classList.remove('hidden');
  clearTimeout(tt); tt = setTimeout(() => t.classList.add('hidden'), 3400);
}
const openM = id => $(id).classList.remove('hidden');
const closeM = () => document.querySelectorAll('[id^="m-"]').forEach(m => m.classList.add('hidden'));
document.addEventListener('click', e => {
  if (e.target.hasAttribute('data-close') || (e.target.id || '').startsWith('m-')) closeM();
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeM(); });

/* ---------- Discord OAuth (implicit flow) ---------- */
function discordLogin() {
  if (CFG.discordClientId.startsWith('YOUR_')) return toast('ยังไม่ได้ตั้งค่า discordClientId ในโค้ด', 'err');
  location.href = 'https://discord.com/oauth2/authorize?client_id=' + CFG.discordClientId +
    '&response_type=token&scope=identify&redirect_uri=' + encodeURIComponent(location.origin + location.pathname);
}
async function initDiscord() {
  if (location.hash.includes('access_token')) {
    const p = new URLSearchParams(location.hash.slice(1));
    LS.set('skr_dc', JSON.stringify({ token: p.get('access_token'), exp: Date.now() + (+p.get('expires_in') || 0) * 1000 }));
    history.replaceState(null, '', location.pathname + location.search);
  }
  let s = null;
  try { s = JSON.parse(LS.get('skr_dc')) } catch {}
  if (!s || s.exp < Date.now()) { LS.del('skr_dc'); return; }
  try {
    const r = await fetch('https://discord.com/api/users/@me', { headers: { Authorization: 'Bearer ' + s.token } });
    if (!r.ok) throw 0;
    discordUser = await r.json();
  } catch { LS.del('skr_dc'); }
}

/* ---------- GitHub data layer ---------- */
const ghToken = () => LS.get('skr_gh') || '';
const api = p => `https://api.github.com/repos/${CFG.owner}/${CFG.repo}/contents/${p}`;
const rawUrl = p => `https://raw.githubusercontent.com/${CFG.owner}/${CFG.repo}/${CFG.branch}/${p}`;
const b64enc = s => btoa(unescape(encodeURIComponent(s)));
const b64dec = s => decodeURIComponent(escape(atob(s.replace(/\n/g, ''))));
const ghH = () => { const h = { Accept: 'application/vnd.github+json' }; if (ghToken()) h.Authorization = 'Bearer ' + ghToken(); return h; };
const errMsg = (s, w) => s === 401 ? 'Token ไม่ถูกต้องหรือหมดอายุ' : (s === 403 || s === 404) ? 'Token ไม่มีสิทธิ์เขียน (ต้องมี Contents: Read and write)' : w + ' (' + s + ')';

async function loadServers() {
  try {
    const r = await fetch(api(CFG.path) + '?ref=' + CFG.branch + '&t=' + Date.now(), { headers: ghH(), cache: 'no-store' });
    if (!r.ok) throw 0;
    servers = JSON.parse(b64dec((await r.json()).content));
  } catch {
    try { const r = await fetch(CFG.path + '?t=' + Date.now(), { cache: 'no-store' }); if (r.ok) servers = await r.json(); } catch {}
  }
  if (!Array.isArray(servers)) servers = [];
  $('#sync').textContent = new Date().toLocaleTimeString(lang === 'th' ? 'th-TH' : 'en-US', { hour: '2-digit', minute: '2-digit' });
  render();
}

// อ่านไฟล์ล่าสุด -> แก้ไข -> Commit (กันข้อมูลทับกัน)
async function mutate(fn, message) {
  if (!ghToken()) throw new Error('ยังไม่ได้ใส่ GitHub Token');
  let sha, list = [];
  const g = await fetch(api(CFG.path) + '?ref=' + CFG.branch + '&t=' + Date.now(), { headers: ghH(), cache: 'no-store' });
  if (g.ok) { const j = await g.json(); sha = j.sha; list = JSON.parse(b64dec(j.content)); }
  else if (g.status !== 404) throw new Error(errMsg(g.status, 'อ่านไฟล์ไม่สำเร็จ'));
  const next = fn(Array.isArray(list) ? list : []);
  const body = { message, content: b64enc(JSON.stringify(next, null, 2) + '\n'), branch: CFG.branch };
  if (sha) body.sha = sha;
  const p = await fetch(api(CFG.path), { method: 'PUT', headers: { ...ghH(), 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
  if (!p.ok) throw new Error(errMsg(p.status, 'Commit ไม่สำเร็จ'));
  servers = next;
}

async function putImage(path, b64, msg) {
  const p = await fetch(api(path), { method: 'PUT', headers: { ...ghH(), 'Content-Type': 'application/json' }, body: JSON.stringify({ message: msg, content: b64, branch: CFG.branch }) });
  if (!p.ok) throw new Error(errMsg(p.status, 'อัปโหลดรูปไม่สำเร็จ'));
}
async function delImage(path) {
  try {
    const g = await fetch(api(path) + '?ref=' + CFG.branch, { headers: ghH() });
    if (!g.ok) return;
    await fetch(api(path), { method: 'DELETE', headers: { ...ghH(), 'Content-Type': 'application/json' }, body: JSON.stringify({ message: 'Remove image', sha: (await g.json()).sha, branch: CFG.branch }) });
  } catch {}
}
// ย่อรูปในเบราว์เซอร์ก่อนอัปโหลด (สูงสุด 1600px, JPEG)
async function compress(file) {
  const bm = await createImageBitmap(file), k = Math.min(1, 1600 / bm.width);
  const c = document.createElement('canvas');
  c.width = Math.round(bm.width * k); c.height = Math.round(bm.height * k);
  c.getContext('2d').drawImage(bm, 0, 0, c.width, c.height);
  return c.toDataURL('image/jpeg', .86).split(',')[1];
}

function mark() {

  const acct = (discordUser

    : `<div class="tile empty"></div>`;

const validVoice = u => /^https:\/\/(discord\.com\/channels\/|discord\.gg\/|discord\.com\/invite\/)/.test(u);

document.addEventListener('click', async e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const a = b.dataset.act, id = b.dataset.id;

  if (a === 'pick') { setSel(id); clearInterval(timer); if (b.closest('#grid')) scrollTo({ top: 0, behavior: 'smooth' }), $('main').scrollTo?.({ top: 0, behavior: 'smooth' }); return; }
  if (a === 'lang') { lang = b.dataset.l; LS.set('skr_lang', lang); return applyLang(); }
  if (a === 'top') return $('main').scrollTo({ top: 0, behavior: 'smooth' });
  if (a === 'list') return $('#list').scrollIntoView({ behavior: 'smooth' });
  if (a === 'dc-in') return discordLogin();
  if (a === 'dc-out') { LS.del('skr_dc'); discordUser = null; render(); return toast('ออกจากระบบ Discord แล้ว'); }
  if (a === 'admin-open') {
    if (!isAdmin) { $('#a-err').classList.add('hidden'); openM('#m-login'); return $('#a-user').focus(); }
    $('#gh-token').value = ghToken(); ghState(); return openM('#m-admin');
  }
  if (a === 'admin-out') { isAdmin = false; LS.del('skr_admin'); render(); return toast('ออกจาก Admin แล้ว'); }

  if (a === 'join') {
    const s = cur();
    if (!unlocked()) return toast('กรุณา Login with Discord ก่อนเข้าห้องเสียง', 'err');
    if (s && validVoice(s.voiceLink)) window.open(s.voiceLink, '_blank', 'noopener');
    else toast('ลิงก์ห้องเสียงไม่ถูกต้อง', 'err');
    return;
  }
  if (a === 'del' && isAdmin) {
    const s = servers.find(x => x.id === id);
    if (!s || !confirm((lang === 'en' ? 'Delete "' : 'ลบ "') + s.name + '" ?')) return;
    b.disabled = true;
    try {
      await mutate(l => l.filter(x => x.id !== id), 'Remove server: ' + s.name);
      if (s.image && s.image.startsWith(CFG.imgDir)) delImage(s.image);
      render(); toast('ลบและ Commit ไปยัง GitHub สำเร็จ', 'ok');
    } catch (err) { b.disabled = false; toast(err.message, 'err'); }
  }
});

$('#f-save').onclick = async () => {
  const id = Date.now().toString(36);
  const item = { id, name: $('#f-name').value.trim(), description: $('#f-desc').value.trim(), voiceLink: $('#f-voice').value.trim(), image: '' };
  if (!item.name) return toast('กรุณากรอกชื่อเซิร์ฟเวอร์', 'err');
  if (!validVoice(item.voiceLink)) return toast('ลิงก์ห้องเสียงต้องขึ้นต้นด้วย https://discord.com/ หรือ https://discord.gg/', 'err');
  if (pendingFile && !pendingFile.type.startsWith('image/')) return toast('ไฟล์ต้องเป็นรูปภาพ', 'err');
  const btn = $('#f-save'); btn.disabled = true; btn.textContent = T('กำลังอัปโหลดและ Commit...');

    if (pendingFile) {
      item.image = `${CFG.imgDir}/${id}.jpg`;

  } catch (err) { toast(err.message, 'err'); }
  btn.disabled = false; btn.textContent = 'บันทึกและ Commit ไปยัง GitHub'; applyLang();
};

function applyLang() {

  for (let n; (n = w.nextNode());) {

/* ---------- Particles ---------- */
const fx = $('#fx'), cx = fx.getContext('2d'), RM = matchMedia('(prefers-reduced-motion: reduce)').matches;
let W = 0, H = 0, P = [], bursts = [], mouse = { x: -999, y: -999 };
function fxSize() {
  const d = devicePixelRatio || 1; W = innerWidth; H = innerHeight;
  fx.width = W * d; fx.height = H * d; cx.setTransform(d, 0, 0, d, 0, 0);
  const n = Math.min(90, Math.round(W * H / 17000));
  while (P.length < n) P.push({ x: Math.random() * W, y: Math.random() * H, vx: (Math.random() - .5) * .4, vy: (Math.random() - .5) * .4, r: Math.random() * 1.5 + .6 });
  P.length = n;
}
function frame() {
  cx.clearRect(0, 0, W, H);
  for (const p of P) {
    const dx = p.x - mouse.x, dy = p.y - mouse.y, d2 = dx * dx + dy * dy;
    if (d2 < 16000 && d2 > 1) { const d = Math.sqrt(d2), f = (1 - d2 / 16000) * .12; p.vx += dx / d * f; p.vy += dy / d * f; }
    p.vx *= .99; p.vy *= .99;
    if (Math.abs(p.vx) + Math.abs(p.vy) < .14) { p.vx += (Math.random() - .5) * .06; p.vy += (Math.random() - .5) * .06; }
    if (!RM) { p.x += p.vx; p.y += p.vy; }
    if (p.x < 0) p.x = W; else if (p.x > W) p.x = 0;
    if (p.y < 0) p.y = H; else if (p.y > H) p.y = 0;
  }
  for (let i = 0; i < P.length; i++) {
    const a = P[i];
    cx.fillStyle = 'rgba(92,208,247,.75)'; cx.beginPath(); cx.arc(a.x, a.y, a.r, 0, 6.283); cx.fill();
    for (let j = i + 1; j < P.length; j++) {
      const b = P[j], d = Math.hypot(a.x - b.x, a.y - b.y);
      if (d < 130) { cx.strokeStyle = `rgba(42,169,220,${(1 - d / 130) * .22})`; cx.beginPath(); cx.moveTo(a.x, a.y); cx.lineTo(b.x, b.y); cx.stroke(); }
    }
    const dm = Math.hypot(a.x - mouse.x, a.y - mouse.y);
    if (dm < 150) { cx.strokeStyle = `rgba(92,208,247,${(1 - dm / 150) * .5})`; cx.beginPath(); cx.moveTo(a.x, a.y); cx.lineTo(mouse.x, mouse.y); cx.stroke(); }
  }
  for (let i = bursts.length - 1; i >= 0; i--) {
    const b = bursts[i]; b.x += b.vx; b.y += b.vy; b.vx *= .95; b.vy *= .95; b.l -= .025;
    if (b.l <= 0) { bursts.splice(i, 1); continue; }
    cx.fillStyle = `rgba(140,225,255,${b.l})`; cx.fillRect(b.x - 1.5, b.y - 1.5, 3, 3);
  }
  if (!RM) requestAnimationFrame(frame);
}
function burst(x, y) {
  if (RM) return;
  for (let i = 0; i < 14; i++) { const a = Math.random() * 6.283, v = 1 + Math.random() * 2.6; bursts.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, l: 1 }); }
}
addEventListener('resize', () => { fxSize(); if (RM) frame(); });

if (matchMedia('(pointer:fine)').matches) {
  const cr = $('#cr'), cd = $('#cd'); let tx = 0, ty = 0, rx = 0, ry = 0;
  addEventListener('mousemove', e => {
    tx = e.clientX; ty = e.clientY; mouse.x = tx; mouse.y = ty;
    cd.style.opacity = cr.style.opacity = 1;
    cd.style.transform = `translate(${tx}px,${ty}px)`;
    cr.classList.toggle('h', !!(e.target.closest && e.target.closest('button,a,label,[data-act],.tile,.news')));
  });
  addEventListener('mousedown', () => cr.classList.add('d'));
  addEventListener('mouseup', () => cr.classList.remove('d'));
  addEventListener('click', e => burst(e.clientX, e.clientY));
  document.documentElement.addEventListener('mouseleave', () => { cd.style.opacity = cr.style.opacity = 0; mouse.x = mouse.y = -999; });
  (function ring() { const k = RM ? 1 : .18; rx += (tx - rx) * k; ry += (ty - ry) * k; cr.style.transform = `translate(${rx}px,${ry}px)`; requestAnimationFrame(ring); })();
}

/* ---------- บังคับ Login (Discord หรือ Admin) ---------- */
function applyGate() {
  const lock = !unlocked();
  $('#gate').style.display = lock ? 'flex' : 'none';
  $('#app').style.visibility = lock ? 'hidden' : 'visible';
}

/* ---------- ล็อกขนาดหน้าเว็บ (ตั้งค่าที่ CFG.stage) ---------- */
function fitStage() {
  const c = CFG.stage, st = $('#stage');
  const k = c.mode === 'fixed' ? 1 : Math.max(c.min, Math.min(c.max, innerWidth / c.w, innerHeight / c.h));
  st.style.width = c.w + 'px'; st.style.height = c.h + 'px';
  st.style.transform = `scale(${k})`;
  st.style.left = Math.max(0, (innerWidth - c.w * k) / 2) + 'px';
  st.style.top = Math.max(0, (innerHeight - c.h * k) / 2) + 'px';
}
addEventListener('resize', fitStage);
addEventListener('wheel', e => { if (e.ctrlKey) e.preventDefault(); }, { passive: false });
addEventListener('keydown', e => { if ((e.ctrlKey || e.metaKey) && ['+', '-', '=', '_', '0'].includes(e.key)) e.preventDefault(); });
['gesturestart', 'gesturechange'].forEach(ev => addEventListener(ev, e => e.preventDefault()));

/* ---------- Loading screen ---------- */
function step(th, pct) { $('#ld-t').textContent = T(th); $('#ld-b').style.width = pct + '%'; }

/* ---------- Boot ---------- */
(async () => {
  const t0 = Date.now();
  fitStage(); fxSize(); frame(); render();
  step('กำลังเริ่มระบบ...', 15);
  try { await document.fonts.ready; } catch {}
  step('กำลังตรวจสอบ Discord...', 45);
  await initDiscord();
  step('กำลังโหลดเซิร์ฟเวอร์...', 75);
  await loadServers();
  step('พร้อมใช้งาน', 100);
  await new Promise(r => setTimeout(r, Math.max(0, 1700 - (Date.now() - t0))));
  $('#loader').classList.add('done');
  setTimeout(() => $('#loader').remove(), 800);
  setInterval(loadServers, 30000);
})();
</script>
